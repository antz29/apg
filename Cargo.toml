[package]
name = "apg"
version = "0.8.0"
edition = "2024"
description = "Program graph scanner + LadybugDB query CLI for opencode"
license = "MIT"

[[bin]]
name = "apg"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
lbug = "0.19.1"
parquet = { version = "55", default-features = false, features = ["snap"] }
