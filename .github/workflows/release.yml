name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # GitHub Actions runners can't satisfy Homebrew's tap-trust check (it needs a
  # user-scoped token); the taps here are our own first-party tap.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
  # gh doesn't auto-read GITHUB_TOKEN in Actions.
  GH_TOKEN: ${{ github.token }}

jobs:
  bottle:
    name: Bottle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel (macos-13) runners have been retired upstream, so only ARM
          # bottles are published; Intel Macs build from source.
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Tap apg
        run: brew tap antz29/apg "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Build and install formulae with --build-bottle
        run: |
          brew install --build-bottle antz29/apg/scanner
          brew install --build-bottle antz29/apg/apg-go antz29/apg/apg-java antz29/apg/apg-cpp antz29/apg/apg-rust antz29/apg/apg-ts antz29/apg/apg-csharp antz29/apg/apg-py antz29/apg/apg-md

      - name: Create bottles
        working-directory: ${{ runner.temp }}
        run: |
          brew bottle \
            --json \
            --root-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            scanner apg-go apg-java apg-cpp apg-rust apg-ts apg-csharp apg-py apg-md

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bottles-${{ matrix.arch }}
          path: ${{ runner.temp }}/*.bottle*.tar.gz
          if-no-files-found: error

      - name: Upload bottle JSON
        uses: actions/upload-artifact@v7
        with:
          name: bottles-json-${{ matrix.arch }}
          path: ${{ runner.temp }}/*.bottle*.json
          if-no-files-found: error

  linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # Pin JDK 21: the Java frontend is compiled with `javac --release 21`, and
      # the runner's default `javac` is older (a pre-installed JDK wins PATH
      # over any apt-installed one), which would silently fail the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build deps
        run: |
          sudo apt-get update
          # lbug's build.rs uses pkg-config to find OpenSSL and links
          # libssl/libcrypto dynamically; node/npm for the TypeScript frontend
          # (build.rs runs `npm ci` in src/tslib); dotnet is installed via
          # setup-dotnet and the JDK via setup-java above. go + gcc/g++ are
          # preinstalled on the runners.
          sudo apt-get install -y pkg-config libssl-dev nodejs npm

      - name: Resolve lbug version from Cargo.lock
        id: lbug
        run: |
          LBUG_VERSION="$(awk '/^name = "lbug"$/ { f=1 } f && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          echo "version=${LBUG_VERSION}" >>"$GITHUB_OUTPUT"

      - name: Fetch prebuilt liblbug
        run: |
          VERSION="${{ steps.lbug.outputs.version }}"
          curl -fsSL -o lbug.tar.gz \
            "https://github.com/LadybugDB/ladybug/releases/download/v${VERSION}/liblbug-static-linux-${{ matrix.arch }}-compat.tar.gz"
          mkdir -p lbug-static
          tar -xzf lbug.tar.gz -C lbug-static
          # External prebuilt path: lbug's build.rs uses both vars and skips
          # downloading/compiling its own copy.
          echo "LBUG_LIBRARY_DIR=${PWD}/lbug-static" >>"$GITHUB_ENV"
          echo "LBUG_INCLUDE_DIR=${PWD}/lbug-static" >>"$GITHUB_ENV"

      # build.rs compiles all frontends (Go, C++, Java, Rust, TS, C#, Python,
      # Markdown) and stages them into target/release/frontends; the default
      # APG_BUILD_FRONTENDS (unset) does exactly what we want here.
      - name: Build apg + frontends
        run: cargo build --release

      - name: Verify every frontend was built
        run: |
          for f in cppfrontend gofrontend rustfrontend csharpfrontend \
                   java-classes tsfrontend pyfrontend mdfrontend; do
            test -e "target/release/frontends/$f" \
              || { echo "frontend not staged: $f"; exit 1; }
          done

      - name: Package tarballs
        run: |
          mkdir -p dist/packages

          # 1. Base scanner
          tar -C target/release -czf "dist/packages/apg-linux-${{ matrix.arch }}.tar.gz" apg

          # 2. Per-language frontends
          tar -C target/release/frontends -czf "dist/packages/apg-cpp-linux-${{ matrix.arch }}.tar.gz" cppfrontend
          tar -C target/release/frontends -czf "dist/packages/apg-go-linux-${{ matrix.arch }}.tar.gz" gofrontend
          tar -C target/release/frontends -czf "dist/packages/apg-rust-linux-${{ matrix.arch }}.tar.gz" rustfrontend
          tar -C target/release/frontends -czf "dist/packages/apg-csharp-linux-${{ matrix.arch }}.tar.gz" csharpfrontend
          tar -C target/release/frontends -czf "dist/packages/apg-java-linux-${{ matrix.arch }}.tar.gz" java-classes
          tar -C target/release/frontends -czf "dist/packages/apg-ts-linux-${{ matrix.arch }}.tar.gz" tsfrontend
          tar -C target/release/frontends -czf "dist/packages/apg-py-linux-${{ matrix.arch }}.tar.gz" pyfrontend
          tar -C target/release/frontends -czf "dist/packages/apg-md-linux-${{ matrix.arch }}.tar.gz" mdfrontend

          # 3. All-in-one bundle
          mkdir -p dist/all/frontends
          cp target/release/apg dist/all/
          cp -r target/release/frontends/. dist/all/frontends/
          tar -C dist/all -czf "dist/packages/apg-all-linux-${{ matrix.arch }}.tar.gz" .

          cd dist/packages
          for f in *.tar.gz; do
            sha256sum "$f" > "${f}.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: apg-linux-${{ matrix.arch }}
          path: |
            dist/packages/*.tar.gz
            dist/packages/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [bottle, linux]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # --- bottles: merge the sha256s back into the tap formulae on main ---
      - name: Download bottle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bottles-*
          merge-multiple: true
          path: bottles

      - name: Tap apg
        run: brew tap antz29/apg "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Merge bottle blocks into formulae
        run: |
          brew bottle --merge --write --no-commit --json bottles/*.bottle.json
          # brew writes into the tap checkout (dir name gets a "homebrew-" prefix);
          # copy the updated formulae back into the workspace.
          find "$(brew --prefix)/Library/Taps/antz29" -path '*/Formula/*.rb' -exec cp '{}' "${GITHUB_WORKSPACE}/Formula/" \;

      - name: Commit bottle updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "No formula changes to commit"
          else
            git commit -m "Update bottle sha256s for ${GITHUB_REF_NAME}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      # --- linux tarballs + merged checksums ---
      - uses: actions/download-artifact@v8
        with:
          pattern: apg-linux-*
          merge-multiple: true
          path: dist

      - name: Merge checksums
        working-directory: dist
        run: |
          cat *.sha256 > sha256sums.txt
          rm *.sha256

      # brew writes bottle files as <name>--<version>... but builds the fetch URL
      # as <name>-<version>...; rename to match what brew fetches.
      - name: Normalize bottle filenames
        run: |
          for f in bottles/*--*.bottle*.tar.gz; do
            mv "$f" "$(echo "$f" | sed 's/--/-/')"
          done

      # Immutable releases forbid adding assets after publish, so the release is
      # created as a draft, every asset is attached, and only then is it
      # published. Creating the release here (once, after both builds) also
      # removes the create-vs-upload race the two old workflows had.
      - name: Create the release as a draft
        run: gh release create "${GITHUB_REF_NAME}" --draft --generate-notes

      - name: Attach every asset
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            bottles/*.bottle*.tar.gz \
            dist/*.tar.gz dist/sha256sums.txt

      - name: Publish the release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
