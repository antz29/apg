name: Build and publish bottles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # GitHub Actions runners can't satisfy Homebrew's tap-trust check (it needs a
  # user-scoped token); the taps here are our own first-party tap.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  bottle:
    name: Bottle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel (macos-13) runners have been retired upstream, so only ARM
          # bottles are published; Intel Macs build from source.
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Tap apg
        run: brew tap antz29/apg "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Build and install formulae with --build-bottle
        run: |
          brew install --build-bottle antz29/apg/scanner
          brew install --build-bottle antz29/apg/apg-go antz29/apg/apg-java antz29/apg/apg-cpp

      - name: Create bottles
        working-directory: ${{ runner.temp }}
        run: |
          brew bottle \
            --json \
            --root-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            scanner apg-go apg-java apg-cpp

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.arch }}
          path: ${{ runner.temp }}/*.bottle*.tar.gz
          if-no-files-found: error

      - name: Upload bottle JSON
        uses: actions/upload-artifact@v4
        with:
          name: bottles-json-${{ matrix.arch }}
          path: ${{ runner.temp }}/*.bottle*.json
          if-no-files-found: error

  publish:
    name: Publish bottles
    needs: bottle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download bottle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bottles-*
          merge-multiple: true
          path: bottles

      - name: Tap apg
        run: brew tap antz29/apg "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Merge bottle blocks into formulae
        run: |
          brew bottle --merge --write --no-commit --json bottles/*.bottle.json
          # brew writes into the tap checkout; copy the updated formulae back.
          cp "$(brew --prefix)/Library/Taps/antz29/apg/Formula/"*.rb "${GITHUB_WORKSPACE}/Formula/"

      - name: Commit bottle updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "No formula changes to commit"
          else
            git commit -m "Update bottle sha256s for ${GITHUB_REF_NAME}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Ensure GitHub release exists
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Upload bottles to release
        run: gh release upload "${GITHUB_REF_NAME}" bottles/*.bottle.tar.gz --clobber
