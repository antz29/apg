name: Build and publish Linux binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install build deps
        run: |
          sudo apt-get update
          # lbug's build.rs uses pkg-config to find OpenSSL and links
          # libssl/libcrypto dynamically; javac is needed for the Java
          # frontend; node/npm for the TypeScript frontend (build.rs runs
          # `npm ci` in src/tslib); dotnet is installed via setup-dotnet above.
          # go + gcc/g++ are preinstalled on the runners.
          sudo apt-get install -y pkg-config libssl-dev default-jdk-headless nodejs npm

      - name: Resolve lbug version from Cargo.lock
        id: lbug
        run: |
          LBUG_VERSION="$(awk '/^name = "lbug"$/ { f=1 } f && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          echo "version=${LBUG_VERSION}" >>"$GITHUB_OUTPUT"

      - name: Fetch prebuilt liblbug
        run: |
          VERSION="${{ steps.lbug.outputs.version }}"
          curl -fsSL -o lbug.tar.gz \
            "https://github.com/LadybugDB/ladybug/releases/download/v${VERSION}/liblbug-static-linux-${{ matrix.arch }}-compat.tar.gz"
          mkdir -p lbug-static
          tar -xzf lbug.tar.gz -C lbug-static
          # External prebuilt path: lbug's build.rs uses both vars and skips
          # downloading/compiling its own copy.
          echo "LBUG_LIBRARY_DIR=${PWD}/lbug-static" >>"$GITHUB_ENV"
          echo "LBUG_INCLUDE_DIR=${PWD}/lbug-static" >>"$GITHUB_ENV"

      # build.rs compiles all frontends (Go, C++, Java, Rust, TS) and stages them
      # into target/release/frontends; the default APG_BUILD_FRONTENDS (unset)
      # does exactly what we want here.
      - name: Build apg + frontends
        run: cargo build --release

      - name: Package tarballs
        run: |
          mkdir -p dist/packages

          # 1. Base scanner
          tar -C target/release -czf "dist/packages/apg-linux-${{ matrix.arch }}.tar.gz" apg

          # 2. Per-language frontends
          tar -C target/release/frontends -czf "dist/packages/apg-cpp-linux-${{ matrix.arch }}.tar.gz" cppfrontend
          tar -C target/release/frontends -czf "dist/packages/apg-go-linux-${{ matrix.arch }}.tar.gz" gofrontend
          tar -C target/release/frontends -czf "dist/packages/apg-rust-linux-${{ matrix.arch }}.tar.gz" rustfrontend
          tar -C target/release/frontends -czf "dist/packages/apg-csharp-linux-${{ matrix.arch }}.tar.gz" csharpfrontend
          tar -C target/release/frontends -czf "dist/packages/apg-java-linux-${{ matrix.arch }}.tar.gz" java-classes
          tar -C target/release/frontends -czf "dist/packages/apg-ts-linux-${{ matrix.arch }}.tar.gz" tsfrontend

          # 3. All-in-one bundle
          mkdir -p dist/all/frontends
          cp target/release/apg dist/all/
          cp -r target/release/frontends/. dist/all/frontends/
          tar -C dist/all -czf "dist/packages/apg-all-linux-${{ matrix.arch }}.tar.gz" .

          cd dist/packages
          for f in *.tar.gz; do
            sha256sum "$f" > "${f}.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: apg-linux-${{ matrix.arch }}
          path: |
            dist/packages/*.tar.gz
            dist/packages/*.sha256
          if-no-files-found: error

  publish:
    name: Publish Linux binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh resolves the repo from git remotes, so this job needs a checkout.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: apg-linux-*
          merge-multiple: true
          path: dist

      - name: Merge checksums
        working-directory: dist
        run: |
          cat *.sha256 > sha256sums.txt
          rm *.sha256

      - name: Ensure GitHub release exists
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # The bottle workflow may create the release concurrently on the
            # same tag push; absorb that 422 race, then confirm below.
            gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1

      - name: Upload tarballs + checksums
        working-directory: dist
        run: |
          gh release upload "${GITHUB_REF_NAME}" *.tar.gz sha256sums.txt --clobber
